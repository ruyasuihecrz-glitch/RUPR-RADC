[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rupr-radc"
version = "1.0.0"
description = "Evidence ordering and relation-aware calibration for frozen multimodal news verification"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "Pillow"]
[project.optional-dependencies]
runtime = ["transformers==5.12.1", "smolagents==1.26.0", "peft==0.20.0", "qwen-vl-utils", "open-clip-torch==2.24.0", "scipy", "accelerate"]
train = ["scipy", "scikit-learn"]
[project.scripts]
rupr-radc = "rupr_radc.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
